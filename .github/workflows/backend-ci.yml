# Backend CI — her PR'da backend kodunun doğru ve hatasız çalıştığını kontrol eder.
#
# İşler (job'lar):
#   1. changes   : PR backend'e dokunuyor mu? Dokunmuyorsa diğer işler atlanır (dokümantasyon PR'ları beklemez).
#   2. lint      : ruff ile kod stili ve olası hatalar (hatalar PR'da ilgili satıra yorum olarak düşer).
#   3. typecheck : mypy ile tip kontrolü.
#   4. test      : pytest + kapsam (coverage) raporu (özet, iş sayfasının "Summary" kısmında görünür).
#   5. smoke     : Gerçek PostgreSQL + Redis ile migration'ı uygular, veritabanı testlerini çalıştırır,
#                  API ve Celery işçisini ayağa kaldırıp uçtan uca dener.
#   6. dependencies: Bağımlılık sürümleri tutarlı mı (pyproject.toml, uv.lock, requirements.txt)?
#   7. docker    : Docker Compose dosyaları geçerli mi, backend imajı (API, Celery, STT) derleniyor mu?
#   8. security  : Bağımlılıklarda bilinen güvenlik açığı var mı (pip-audit)? Yalnızca uyarır, PR'ı kırmaz.
#   9. backend-ci: Tüm sonuçları toplayan tek kontrol. Branch korumasında "zorunlu kontrol" olarak bu seçilir.
#
# `test` işi ayrıca belge/kod tutarlılığını denetler (tests/test_docs_consistency.py): bozuk bağlantı,
# `docs/api.md` içinde olmayan uç nokta, `docs/db_schema.md` içinde olmayan tablo, mimari belgede
# eksik teknoloji, `frontend/openapi.json` ve API örnekleriyle ayrışma (tests/test_api_contract.py).

name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

# Aynı PR'a yeni commit gelirse eski çalışma iptal edilir (zaman ve dakika kotası tasarrufu).
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  UV_VERSION: "0.11.17"
  # Testler yerel .env dosyasına değil, bu ortam değişkenlerine bakar.
  APP_ENV: test

jobs:
  changes:
    name: Değişiklik tespiti
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'infra/**'
              - '.github/workflows/backend-ci.yml'
              # Backend testlerinin denetlediği paylaşılan sözleşmeler (enum tutarlılığı, sentetik veri)
              - 'data/synthetic/**'
              - 'docs/**'
              - 'README.md'
              - 'README.en.md'
              - 'Sistem_mimarisi_v5.md'
              - 'frontend/lib/types.ts'
              - 'frontend/lib/api-types.ts'
              - 'frontend/openapi.json'
              - 'frontend/mocks/**'

  lint:
    name: Lint (ruff)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Bağımlılıkları kur
        run: uv sync --locked --extra ai
      - name: Ruff kontrol
        # github formatı: hatalar PR'daki "Files changed" sekmesinde satır üzerinde görünür.
        run: uv run ruff check . --output-format=github
      - name: Ruff format kontrolü
        run: uv run ruff format --check --diff .

  typecheck:
    name: Tip kontrolü (mypy)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Bağımlılıkları kur
        run: uv sync --locked --extra ai
      - name: Mypy
        run: uv run mypy app tests

  test:
    name: Testler (pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Bağımlılıkları kur (STT ekstrası dahil; model indirilmez)
        run: uv sync --locked --extra ai --extra stt
      - name: Pytest
        run: >
          uv run pytest
          --tb=short
          --junitxml=reports/junit.xml
          --cov=app --cov-report=term-missing
      - name: Kapsam özetini yaz
        if: always()
        run: |
          echo "## Test kapsamı (coverage)" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || echo "Kapsam raporu üretilemedi." >> "$GITHUB_STEP_SUMMARY"
      - name: Test raporunu sakla
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-raporu
          path: backend/reports/
          retention-days: 7

  smoke:
    name: Uçtan uca duman testi (API + Celery + DB + Redis)
    needs: [changes, test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # infra/docker-compose.yml ile aynı imajlar → yerelde ve CI'da aynı ortam.
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: call_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d call_center"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/call_center
      REDIS_URL: redis://localhost:6379/0
      AUTH_DEV_BYPASS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Bağımlılıkları kur
        run: uv sync --locked --extra ai
      - name: Migration (upgrade → model farkı yok mu → downgrade → tekrar upgrade)
        # Şema gerçek PostgreSQL + pgvector üzerinde kurulur, geri alınır ve yeniden kurulur;
        # `alembic check` modeller ile migration arasında fark kalmadığını doğrular.
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Veritabanı entegrasyon testleri (CHECK kısıtları, tsvector, vektör araması, seed, analiz kaydı, çağrı ve ses akışı, RAG araması)
        env:
          RUN_DB_TESTS: "1"
        run: uv run pytest tests/test_db_integration.py tests/test_seed_integration.py tests/test_analysis_store_integration.py tests/test_call_ingest_integration.py tests/test_audio_ingest_integration.py tests/test_rag_integration.py -q -p no:cacheprovider
      - name: API ve Celery işçisini başlat
        run: |
          uv run uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          uv run celery -A app.workers.celery_app worker -Q default --concurrency 1 -l info > celery.log 2>&1 &
          # API'nin açılmasını bekle (en fazla 30 sn).
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::API 30 saniyede açılmadı."
          exit 1
      - name: Hazır olma kontrolü (/health/ready → 200)
        run: |
          code=$(curl -s -o ready.json -w "%{http_code}" http://localhost:8000/health/ready)
          cat ready.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::/health/ready $code döndü (beklenen 200). Veritabanı veya Redis bağlantısı başarısız."
            exit 1
          fi
      - name: Oturum ucu (/api/v1/me → 200)
        run: curl -sf http://localhost:8000/api/v1/me
      - name: Celery kuyruk testi (ping → pong)
        run: |
          uv run python -c "
          from app.workers.tasks.system import ping
          result = ping.delay().get(timeout=30)
          assert result == 'pong', result
          print('Celery yanıtı:', result)
          "
      - name: Yükleme → analiz akışı (sahte LLM ile, API + Celery analiz işçisi)
        # Gerçek LLM kotasına dokunmadan metinle çağrı yükler ve analizin `tamam` bitmesini bekler.
        # Ses/STT adımı model indirmeyi gerektirdiği için burada atlanır (konteyner duman testinde var).
        env:
          LLM_PROVIDER: openai_compatible
          LLM_BASE_URL: http://127.0.0.1:9101/v1
          LLM_API_KEY: sahte
          LLM_FAST_MODEL: sahte
          LLM_SMART_MODEL: sahte
          LLM_FALLBACK_MODEL: ""
          LLM_REQUESTS_PER_MINUTE: "0"
        run: |
          uv run python -m scripts.fake_llm --host 127.0.0.1 --port 9101 > fake_llm.log 2>&1 &
          uv run celery -A app.workers.celery_app worker -Q analysis --concurrency 1 -n analysis@%h -l info > celery_analysis.log 2>&1 &
          sleep 8
          uv run python -m scripts.duman_testi --base-url http://localhost:8000 --no-seed --skip-audio-upload --timeout 90
      - name: Hata durumunda logları göster
        if: failure()
        run: |
          echo "===== uvicorn.log ====="; cat uvicorn.log || true
          echo "===== celery.log =====";  cat celery.log  || true
          echo "===== celery_analysis.log ====="; cat celery_analysis.log || true
          echo "===== fake_llm.log ====="; cat fake_llm.log || true

  dependencies:
    name: Bağımlılık sürümleri
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: uv.lock, pyproject.toml ile uyumlu mu?
        # pyproject.toml'a kütüphane eklenip `uv lock` çalıştırılmadıysa burada kırılır.
        run: uv lock --check
      - name: requirements dosyalarını uv.lock'tan yeniden üret
        # Komutlar dosyaların başlığındaki komutla birebir aynıdır (README'de de yazıyor).
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-dev --extra ai --extra stt -o requirements.txt
          uv export --frozen --no-hashes --no-emit-project --only-dev -o requirements-dev.txt
      - name: requirements dosyaları güncel mi?
        run: |
          if ! git diff --exit-code -- requirements.txt requirements-dev.txt; then
            echo "::error::requirements dosyaları uv.lock ile uyumsuz. backend/ içinde şu komutları çalıştırıp sonucu commit'leyin (ayrıntı: backend/README.md):"
            echo "uv export --frozen --no-hashes --no-emit-project --no-dev --extra ai --extra stt -o requirements.txt"
            echo "uv export --frozen --no-hashes --no-emit-project --only-dev -o requirements-dev.txt"
            exit 1
          fi

  docker:
    name: Docker (compose geçerli mi, backend imajı derlenir mi?)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Compose dosyalarını doğrula
        run: |
          docker compose -f infra/docker-compose.yml --profile app config --quiet
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.smoke.yml --profile app config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Backend imajını derle (gönderilmez; STT ekstrası dahil)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Güvenlik taraması (pip-audit, bilgi amaçlı)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Yeni açık bildirimi PR ile ilgisiz olabilir; bu yüzden PR'ı kırmaz, yalnızca iş sayfasında görünür.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Bilinen açıklar (requirements.txt)
        working-directory: backend
        run: uvx pip-audit --requirement requirements.txt --no-deps --disable-pip

  backend-ci:
    # Branch korumasında yalnızca bu kontrol "zorunlu" yapılır. Backend'e dokunmayan PR'larda
    # diğer işler atlanır ve bu kontrol yine geçer; böylece dokümantasyon PR'ları takılı kalmaz.
    name: Backend CI sonucu
    needs: [changes, lint, typecheck, test, smoke, dependencies, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Sonuçları değerlendir
        run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} test=${{ needs.test.result }} smoke=${{ needs.smoke.result }} dependencies=${{ needs.dependencies.result }} docker=${{ needs.docker.result }}"
          if [ "${{ needs.changes.result }}" != "success" ] || \
             [[ "${{ join(needs.*.result, ' ') }}" =~ (failure|cancelled) ]]; then
            echo "::error::Backend CI başarısız. Kırmızı olan işe tıklayıp hatanın yerini görün."
            exit 1
          fi
          echo "Backend CI başarılı."
