# Frontend CI — her PR'da frontend kodunun doğru ve hatasız çalıştığını kontrol eder.
#
# İşler (job'lar):
#   1. frontend : Lint (ESLint) + Build (Next.js — TypeScript tip kontrolü dahil).
#
# Tetiklenme: Yalnızca `frontend/**` yolunu etkileyen PR'larda çalışır.
# Branch korumasında "zorunlu kontrol" olarak `frontend` job'ı seçilir.

name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Aynı PR'a yeni commit gelirse eski çalışma iptal edilir (zaman ve dakika kotası tasarrufu).
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Kodları çek
        uses: actions/checkout@v7

      - name: Node.js kur (LTS 22) ve npm önbelleğini etkinleştir
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur (npm ci)
        run: npm ci

      - name: Lint kontrolü (ESLint)
        run: npm run lint

      - name: Build (Next.js — TypeScript tip kontrolü dahil)
        run: npm run build
