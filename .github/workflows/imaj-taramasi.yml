# Docker imajı taraması (Trivy) — YALNIZCA BİLGİ RAPORU: bulgu olsa da iş kırmaz.
# PR sürelerini uzatmamak için PR'larda çalışmaz; haftalık, elle ve Dockerfile/bağımlılık
# değişikliği main'e girdiğinde çalışır. Sonuç iş sayfasının "Summary" kısmında görünür.

name: İmaj taraması (bilgi)

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'backend/uv.lock'
      - 'frontend/package-lock.json'

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (${{ matrix.imaj }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        imaj: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: İmajı derle (gönderilmez)
        run: docker build -t tarama-${{ matrix.imaj }}:ci ${{ matrix.imaj }}
      - name: Trivy taraması (yüksek/kritik; exit-code 0 olduğu için kırmaz)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: tarama-${{ matrix.imaj }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-${{ matrix.imaj }}.txt
      - name: Özeti yaz
        run: |
          { echo "## Trivy: ${{ matrix.imaj }} imajı (bilgi)"; echo '```'; cat trivy-${{ matrix.imaj }}.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
