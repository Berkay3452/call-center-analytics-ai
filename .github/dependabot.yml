# Dependabot — GitHub'ın kendi botu; bağımlılıkların yeni sürümleri için haftalık PR açar
# (güvenlik açığı bildirimleri ayrıca hemen gelir). Repodaki bu dosyayla açıldı (#272).
#
# Gürültüyü azaltmak için:
# - Küçük (minor) ve yama (patch) güncellemeleri ekosistem başına TEK PR'da gruplanır.
# - Büyük sürüm (major) atlamaları otomatik açılmaz; bilinçli bir kararla elle yapılır.
# - Docker temel imajlarında (Python, Node, uv) yalnızca yama güncellemesi gelir; Python
#   3.12 ve Node 22 sürümü projede sabittir (pyproject, CI ve yerel ortam ile aynı olmalı).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [güvenlik-katmanı, backend]
    groups:
      backend-kucuk:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [güvenlik-katmanı, frontend]
    groups:
      frontend-kucuk:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [güvenlik-katmanı]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major, version-update:semver-minor]
