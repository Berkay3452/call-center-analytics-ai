# Yerel geliştirme bağımlılıkları: PostgreSQL (pgvector) + Redis.
# Çalıştırma (repo kökünden): docker compose -f infra/docker-compose.yml up -d
#
# Not: Üretimde veritabanı Supabase'tir. Bu Postgres, Supabase hazır olana kadar
# backend'i yerelde çalıştırmak içindir (aynı sürüm: PG 17 + pgvector 0.8).

name: call-center-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: call_center
    ports:
      - "5433:5432" # makinede kurulu başka bir Postgres ile çakışmasın diye 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d call_center"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10-alpine
    ports:
      # Windows bazı port aralıklarını (ör. 6292-6391) sistem için ayırabilir ve 6379 açılamaz.
      # O durumda REDIS_PORT=6400 ve backend/.env içinde REDIS_URL=redis://localhost:6400/0 yazın.
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Miço AI araması için embedding servisi (bge-m3, CPU). İsteğe bağlı: "rag" profiliyle açılır.
  #   docker compose -f infra/docker-compose.yml --profile rag up -d
  # İlk açılışta model indirilir (~2,3 GB); `hf-cache` volume'unda saklanır.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    profiles: ["rag"]
    command: ["--model-id", "BAAI/bge-m3", "--max-client-batch-size", "64", "--max-batch-tokens", "2048"]
    ports:
      - "8080:80"
    volumes:
      - hf-cache:/data

volumes:
  pgdata:
  hf-cache:
