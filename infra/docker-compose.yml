# Yerel geliştirme ve sunum/demo bağımlılıkları.
#
# 1. Demo / Sunum (Tek komutla tüm sistem: Postgres + Redis + Backend API + Celery İşçisi + Web Arayüzü):
#    docker compose -f infra/docker-compose.yml --profile app up -d
#    (İsteğe bağlı RAG embedding servisi ile: --profile app --profile rag)
#
# 2. Yerel geliştirme (scripts.dev başlatıcısı veya elle bağımsız geliştirme):
#    docker compose -f infra/docker-compose.yml up -d
#    (Yalnızca Postgres ve Redis ayağa kalkar; API ve Celery host makinede çalıştırılır.)
#
# Not: Üretimde veritabanı Supabase'tir. Bu Postgres, Supabase hazır olana kadar
# backend'i yerelde çalıştırmak içindir (aynı sürüm: PG 17 + pgvector 0.8).

name: call-center-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: call_center
    ports:
      - "5433:5432" # makinede kurulu başka bir Postgres ile çakışmasın diye 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d call_center"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10-alpine
    ports:
      # Windows bazı port aralıklarını (ör. 6292-6391) sistem için ayırabilir ve 6379 açılamaz.
      # O durumda REDIS_PORT=6400 ve backend/.env içinde REDIS_URL=redis://localhost:6400/0 yazın.
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Miço AI araması için embedding servisi (bge-m3, CPU). İsteğe bağlı: "rag" profiliyle açılır.
  #   docker compose -f infra/docker-compose.yml --profile rag up -d
  # İlk açılışta model indirilir (~2,3 GB); `hf-cache` volume'unda saklanır.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    profiles: ["rag"]
    command: ["--model-id", "BAAI/bge-m3", "--max-client-batch-size", "64", "--max-batch-tokens", "2048"]
    ports:
      - "8080:80"
    volumes:
      - hf-cache:/data

  # -----------------------------------------------------------------------------------
  # "app" Profili: Tüm sistemi tek komutla ayağa kaldıran uygulama servisleri (#120)
  # -----------------------------------------------------------------------------------

  # Tek seferlik hazırlık servisi: Migration'ları uygular, boşsa seed verilerini yükler
  init:
    image: call-center-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    profiles: ["app"]
    command: ["python", "-m", "scripts.docker_init"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/call_center
      - REDIS_URL=redis://redis:6379/0
      - TEI_URL=http://embeddings:80
    volumes:
      - ../data:/data:ro
      - audio-storage:/app/storage/audio
      - model-cache:/app/storage/models

  # FastAPI Backend API servisi
  api:
    image: call-center-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/call_center
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - TEI_URL=http://embeddings:80
    volumes:
      - ../data:/data:ro
      - audio-storage:/app/storage/audio
      - model-cache:/app/storage/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Celery Asenkron Analiz ve STT İşçisi (Beat zamanlayıcı dahil)
  worker:
    image: call-center-backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-B", "-Q", "default,stt,analysis,index", "-l", "info"]
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/call_center
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - TEI_URL=http://embeddings:80
    volumes:
      - ../data:/data:ro
      - audio-storage:/app/storage/audio
      - model-cache:/app/storage/models

  # Next.js Frontend Web Arayüzü
  web:
    image: call-center-frontend:latest
    build:
      context: ../frontend
      dockerfile: Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=http://api:8000/api/v1
      - SERVICE_KEY=${SERVICE_API_KEY:-change-me-in-local-env}
      - NEXT_PUBLIC_USE_MOCKS=false
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  hf-cache:
  audio-storage:
  model-cache:
