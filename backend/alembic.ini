# Alembic yapılandırması (backend/ klasöründen çalıştırılır).
# Veritabanı adresi migrations/env.py'de .env'deki DATABASE_URL'den okunur; buraya yazılmaz.
#
#   uv run alembic upgrade head        # şemayı en son sürüme getir
#   uv run alembic downgrade base      # tüm tabloları kaldır
#   uv run alembic check               # modeller ile migration arasında fark var mı?
#   uv run alembic revision --autogenerate -m "aciklama"   # model değişince yeni migration

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
