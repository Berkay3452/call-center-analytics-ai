<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1080" width="1280" height="1080" font-family="Inter, system-ui, sans-serif">
  <!-- Arka Plan -->
  <rect width="1280" height="1080" fill="#F8FAFC"/>

  <!-- ═══════════════════════════════════════════════════════════
       SIDEBAR — TEKNE SAHİBİ PORTALI
  ════════════════════════════════════════════════════════════════ -->
  <rect x="0" y="0" width="240" height="1080" fill="#0F172A"/>

  <!-- Logo -->
  <text x="24" y="36" font-size="11" fill="#64748B" font-weight="600" letter-spacing="1.5">MİÇO USTA</text>
  <text x="24" y="58" font-size="16" fill="#FFFFFF" font-weight="700">⚓ Tekne Sahibi</text>
  <line x1="0" y1="74" x2="240" y2="74" stroke="#1E293B" stroke-width="1"/>

  <!-- Tekne Bilgisi Rozeti -->
  <rect x="16" y="90" width="208" height="56" rx="8" fill="#1E293B"/>
  <text x="30" y="112" font-size="12" fill="#FFFFFF" font-weight="700">⛵ Poyraz</text>
  <text x="30" y="130" font-size="10" fill="#94A3B8">Motoryat 42 • Kalamış Marina C-12</text>

  <!-- Menü Öğeleri -->
  <!-- Teknem & Durum -->
  <text x="28" y="184" font-size="14">🚤</text>
  <text x="52" y="184" font-size="13" fill="#94A3B8" font-weight="500">Teknem &amp; Durum</text>

  <!-- Bakım Geçmişi -->
  <text x="28" y="228" font-size="14">🔧</text>
  <text x="52" y="228" font-size="13" fill="#94A3B8" font-weight="500">Bakım Geçmişi</text>

  <!-- Aktif Menü: Miço AI Asistan -->
  <rect x="12" y="254" width="216" height="42" rx="8" fill="#0284C7" opacity="0.2"/>
  <rect x="12" y="254" width="4" height="42" rx="2" fill="#0284C7"/>
  <text x="28" y="280" font-size="14">🤖</text>
  <text x="52" y="280" font-size="13" fill="#E0F2FE" font-weight="700">Miço AI Asistan</text>
  <circle cx="210" cy="275" r="4" fill="#38BDF8"/>

  <!-- Faturalar & Masraflar -->
  <text x="28" y="326" font-size="14">💳</text>
  <text x="52" y="326" font-size="13" fill="#94A3B8" font-weight="500">Faturalar &amp; Masraflar</text>

  <!-- Belgeler & Ruhsat -->
  <text x="28" y="370" font-size="14">📄</text>
  <text x="52" y="370" font-size="13" fill="#94A3B8" font-weight="500">Belgeler &amp; Sigorta</text>

  <!-- Acil Servis Çağır Butonu (Sidebar İçi) -->
  <rect x="16" y="950" width="208" height="44" rx="8" fill="#DC2626"/>
  <text x="120" y="977" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">🚨 Acil Usta Çağır</text>

  <!-- Kullanıcı Bilgisi -->
  <line x1="0" y1="1014" x2="240" y2="1014" stroke="#1E293B" stroke-width="1"/>
  <circle cx="36" cy="1044" r="14" fill="#1E3A5F"/>
  <text x="36" y="1048" font-size="11" fill="#7DD3FC" text-anchor="middle" font-weight="700">AY</text>
  <text x="58" y="1040" font-size="12" fill="#CBD5E1" font-weight="600">Ahmet Yılmaz</text>
  <text x="58" y="1054" font-size="10" fill="#64748B">Tekne Sahibi (VIP)</text>

  <!-- ═══════════════════════════════════════════════════════════
       HEADER (ÜST BAR)
  ════════════════════════════════════════════════════════════════ -->
  <rect x="240" y="0" width="1040" height="64" fill="#FFFFFF"/>
  <line x1="240" y1="64" x2="1280" y2="64" stroke="#E2E8F0" stroke-width="1"/>

  <text x="264" y="28" font-size="11" fill="#64748B">Tekne Sahibi Portalı</text>
  <text x="370" y="28" font-size="11" fill="#94A3B8"> / </text>
  <text x="386" y="28" font-size="11" fill="#0284C7" font-weight="600">Miço AI Asistan</text>
  <text x="264" y="48" font-size="18" fill="#0F172A" font-weight="700">Tekne Yapay Zekâ Danışmanı</text>

  <!-- Rol Seçici (Miço Usta Entegrasyon Kuralı) -->
  <rect x="1000" y="16" width="150" height="32" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1016" y="36" font-size="11" fill="#0F172A" font-weight="600">⚓ Tekne Sahibi</text>
  <text x="1130" y="36" font-size="10" fill="#64748B">▼</text>

  <circle cx="1180" cy="32" r="14" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="1180" y="36" font-size="13" text-anchor="middle">🔔</text>

  <circle cx="1220" cy="32" r="14" fill="#0284C7"/>
  <text x="1220" y="36" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">AY</text>

  <!-- ═══════════════════════════════════════════════════════════
       ANA SOHBET ALANI
  ════════════════════════════════════════════════════════════════ -->
  <rect x="264" y="80" width="992" height="976" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Sohbet Üst Bilgi Barı -->
  <rect x="264" y="80" width="992" height="52" rx="12" fill="#F8FAFC"/>
  <rect x="264" y="116" width="992" height="16" fill="#F8FAFC"/>
  <line x1="264" y1="132" x2="1256" y2="132" stroke="#E2E8F0" stroke-width="1"/>

  <circle cx="292" cy="106" r="14" fill="#E0F2FE"/>
  <text x="292" y="111" font-size="14" text-anchor="middle">🤖</text>
  <text x="316" y="102" font-size="13" fill="#0F172A" font-weight="700">Miço Usta AI Tekne Asistanı</text>
  <text x="316" y="118" font-size="10" fill="#16A34A" font-weight="600">● Çevrimiçi • Poyraz tekne seyir defteri ve geçmiş usta görüşmelerine bağlı</text>

  <!-- SORU ÖNERİ BUTONLARI (HAZIR PROMPTLAR) -->
  <rect x="284" y="144" width="952" height="48" rx="8" fill="#F1F5F9"/>
  <text x="300" y="172" font-size="11" fill="#64748B" font-weight="700">ÖNERİLEN SORULAR:</text>

  <!-- Soru 1 -->
  <rect x="428" y="152" width="230" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="440" y="172" font-size="11" fill="#0F172A">💬 Son motor bakımım ne zaman yapıldı?</text>

  <!-- Soru 2 -->
  <rect x="668" y="152" width="220" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="680" y="172" font-size="11" fill="#0F172A">💬 Bu ayki marina masrafım ne kadar?</text>

  <!-- Soru 3 -->
  <rect x="898" y="152" width="220" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="910" y="172" font-size="11" fill="#0F172A">💬 Sintine alarmı neden çalar?</text>

  <!-- SOHBET MESAJLARI AKIŞI -->

  <!-- Mesaj 1: Asistan Karşılama -->
  <g transform="translate(284, 208)">
    <circle cx="16" cy="16" r="14" fill="#E0F2FE"/>
    <text x="16" y="21" font-size="14" text-anchor="middle">🤖</text>
    <rect x="40" y="0" width="560" height="52" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="56" y="22" font-size="12" fill="#0F172A">Merhaba Ahmet Bey! Ben Miço Usta Tekne Asistanınız.</text>
    <text x="56" y="38" font-size="12" fill="#0F172A">Tekneniz Poyraz (Motoryat 42) ile ilgili teknik veya operasyonel her şeyi sorabilirsiniz.</text>
    <text x="56" y="60" font-size="9" fill="#94A3B8">Bugün, 09:12</text>
  </g>

  <!-- Mesaj 2: Müşteri Sorusu -->
  <g transform="translate(636, 280)">
    <rect x="0" y="0" width="560" height="44" rx="10" fill="#0284C7"/>
    <text x="16" y="26" font-size="12" fill="#FFFFFF" font-weight="500">
      Son motor bakımım ne zaman yapıldı ve hangi işlemler tamamlandı?
    </text>
    <text x="510" y="54" font-size="9" fill="#94A3B8" text-anchor="end">09:14</text>
  </g>

