    <text x="56" y="24" font-size="12" fill="#0F172A" font-weight="600">
      Tekneniz Poyraz için son periyodik motor bakımı 15 Ağustos 2024 tarihinde yapılmıştır.
    </text>
    <text x="56" y="44" font-size="12" fill="#334155">
      Kalamış Marina'da Baş Usta Mehmet Şimşek tarafından gerçekleştirilen serviste:
    </text>
    <text x="72" y="64" font-size="11" fill="#334155">• 250 saatlik ana makine periyodik bakımı</text>
    <text x="72" y="80" font-size="11" fill="#334155">• Motor yağı (15W-40) ve çift yakıt filtresi değişimi</text>
    <text x="72" y="96" font-size="11" fill="#334155">• Deniz suyu soğutma devresi impeller değişimi ve kayış gerginlik ayarı</text>

    <!-- ── KAYNAK ATIF KARTI (CITATION CARD) ── -->
    <rect x="56" y="112" width="648" height="44" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    <text x="70" y="128" font-size="10" fill="#0284C7" font-weight="700">📌 KAYNAK ATFI:</text>
    <text x="160" y="128" font-size="10" fill="#0F172A" font-weight="600">
      15 Ağustos 2024 tarihli Usta Görüşmesi &amp; Servis Raporu (#SRV-2024-5120)
    </text>
    <text x="70" y="144" font-size="9" fill="#64748B">
      Alıntı: &#8220;Ana makine 250 saatlik bakımı tamamlandı, impeller yenilendi, test seyri başarılı.&#8221;
    </text>

    <text x="56" y="184" font-size="9" fill="#94A3B8">Bugün, 09:14</text>
  </g>

  <!-- Mesaj 4: Müşteri İkinci Sorusu -->
  <g transform="translate(686, 544)">
    <rect x="0" y="0" width="510" height="44" rx="10" fill="#0284C7"/>
    <text x="16" y="26" font-size="12" fill="#FFFFFF" font-weight="500">
