    </text>
    <text x="460" y="54" font-size="9" fill="#94A3B8" text-anchor="end">09:15</text>
  </g>

  <!-- Mesaj 5: Bot İkinci Yanıtı + KAYNAK ATIF KARTI -->
  <g transform="translate(284, 608)">
    <circle cx="16" cy="16" r="14" fill="#E0F2FE"/>
    <text x="16" y="21" font-size="14" text-anchor="middle">🤖</text>

    <!-- Yanıt Balonu -->
    <rect x="40" y="0" width="680" height="140" rx="10" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="1"/>
    <text x="56" y="24" font-size="12" fill="#0F172A">
      Kalamış Marina İskele C-12 için Ekim 2024 cari dönem ekstreniz:
    </text>
    <text x="72" y="44" font-size="11" fill="#334155">• Aylık bağlama bedeli: 11.800 TL</text>
    <text x="72" y="60" font-size="11" fill="#334155">• Sayaç elektrik &amp; tatlı su tüketimi: 2.450 TL</text>
    <text x="72" y="76" font-size="11" fill="#0284C7" font-weight="700">Toplam Ödenecek: 14.250 TL (Son ödeme: 25 Ekim 2024)</text>

    <!-- KAYNAK ATIF KARTI 2 -->
    <rect x="56" y="90" width="648" height="38" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
    <text x="70" y="106" font-size="10" fill="#0284C7" font-weight="700">📌 KAYNAK ATFI:</text>
    <text x="160" y="106" font-size="10" fill="#0F172A" font-weight="600">
      Kalamış Marina Muhasebe Entegrasyonu • 01 Ekim 2024 Fatura No: #FAT-9821
    </text>
    <text x="70" y="120" font-size="9" fill="#64748B">
      Alıntı: &#8220;Poyraz teknesi elektrik sayaç son endeks: 4.812 kWh, su: 18 m³&#8221;
    </text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       BULAMADIM DURUMU — Issue #36 (Yeni)
       Kullanıcı bilinmeyen soru soruyor → asistan kaynak kartı göstermeden yanıt veriyor
  ════════════════════════════════════════════════════════════════ -->

  <!-- Mesaj 6: Kullanıcı — Bilinmeyen Soru -->
  <g transform="translate(686, 776)">
    <rect x="0" y="0" width="510" height="44" rx="10" fill="#0284C7"/>
    <text x="16" y="26" font-size="12" fill="#FFFFFF" font-weight="500">
      Teknemin sigorta poliçe numarası nedir?
    </text>
    <text x="460" y="54" font-size="9" fill="#94A3B8" text-anchor="end">09:17</text>
  </g>

  <!-- Mesaj 7: Asistan — "Bulamadım" Yanıtı (KAYNAK KARTI YOK) -->
  <g transform="translate(284, 840)">
    <circle cx="16" cy="16" r="14" fill="#E0F2FE"/>
    <text x="16" y="21" font-size="14" text-anchor="middle">🤖</text>

    <!-- Bulamadım Yanıt Balonu — gri kenarlık, uyarı tonu -->
    <rect x="40" y="0" width="680" height="80" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>

    <!-- İkon -->
    <text x="56" y="28" font-size="16">ℹ️</text>

    <text x="82" y="28" font-size="12" fill="#475569" font-weight="600">Bu konuda kayıtlarda bilgi bulamadım.</text>
    <text x="56" y="48" font-size="11" fill="#64748B">Sigorta bilgileriniz sistemde kayıtlı değil. Miço Usta servis</text>
    <text x="56" y="64" font-size="11" fill="#64748B">ekibinizle iletişime geçerek bu bilgiyi güncelleyebilirsiniz.</text>

    <!-- Kaynak Kartı YOK — Açıklayıcı not -->
    <rect x="56" y="76" width="648" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="70" y="92" font-size="9" fill="#94A3B8" font-style="italic">ℹ️ Bu yanıt için doğrulanabilir kayıt kaynağı bulunamadı — kaynak kartı gösterilmiyor.</text>

    <text x="56" y="116" font-size="9" fill="#94A3B8">Bugün, 09:17</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════
       MESAJ GİRİŞ ALANI (INPUT BAR)
  ════════════════════════════════════════════════════════════════ -->
  <rect x="284" y="988" width="952" height="52" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="304" y="1020" font-size="13" fill="#94A3B8">
    Tekneniz, bakımlarınız veya marinanız hakkında bir soru sorun…
  </text>
  <!-- Ek Dosya / Mikrofon -->
  <circle cx="1144" cy="1014" r="14" fill="#F1F5F9"/>
  <text x="1144" y="1019" font-size="13" text-anchor="middle">🎙</text>
  <!-- Gönder Butonu -->
  <rect x="1168" y="996" width="60" height="36" rx="8" fill="#0284C7"/>
  <text x="1198" y="1019" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">➤</text>

  <!-- Screen label watermark -->
  <text x="760" y="1068" font-size="10" fill="#CBD5E1" text-anchor="middle">Miço Usta — 03 Tekne Sahibi AI Asistanı  •  Issue #36 Wireframe ("Bulamadım" Durumu + citations dizisi)</text>
</svg>
